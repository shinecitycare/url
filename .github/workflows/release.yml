name: Build Company Kiosk APK

on:
  workflow_dispatch:
    inputs:
      company_name:
        description: "Company name (used for APK filename and app label)"
        required: true
        type: string
      company_code:
        description: "Company code"
        required: true
        type: string
      app_url:
        description: "Fixed URL to open in this company's APK (include https://)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.company_name }} APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate inputs and configure company URL
        env:
          COMPANY_NAME: ${{ inputs.company_name }}
          COMPANY_CODE: ${{ inputs.company_code }}
          APP_URL: ${{ inputs.app_url }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlparse

          company_name = os.environ["COMPANY_NAME"].strip()
          company_code = os.environ["COMPANY_CODE"].strip()
          app_url = os.environ["APP_URL"].strip()

          parsed = urlparse(app_url)
          if parsed.scheme != "https" or not parsed.netloc:
              raise SystemExit("APP_URL must be a valid HTTPS URL.")
          if any(ord(ch) < 32 for ch in app_url):
              raise SystemExit("APP_URL contains invalid control characters.")
          if not company_name or not company_code:
              raise SystemExit("Company name and company code are required.")

          # Locate BrowserPreferences.java without assuming the Java source-set path.
          candidates = list(Path("app").rglob("BrowserPreferences.java"))
          if len(candidates) != 1:
              raise SystemExit(
                  "Expected exactly one app/**/BrowserPreferences.java; found: "
                  + ", ".join(str(p) for p in candidates)
              )
          prefs = candidates[0]
          source = prefs.read_text(encoding="utf-8")
          pattern = r'(static\s+final\s+String\s+DEFAULT_START_URL\s*=\s*)"[^"]*"\s*;'
          updated, count = re.subn(
              pattern,
              lambda m: m.group(1) + '"' + app_url.replace("\\", "\\\\").replace('"', '\\"') + '";',
              source,
              count=1
          )
          if count != 1:
              raise SystemExit("Could not find DEFAULT_START_URL in " + str(prefs))
          prefs.write_text(updated, encoding="utf-8")
          print("Configured fixed start URL in", prefs)

          # Set the launcher label to the company name, when app_name exists.
          string_files = list(Path("app/src/main").rglob("strings.xml"))
          changed = False
          for strings_file in string_files:
              xml = strings_file.read_text(encoding="utf-8")
              if re.search(r'<string\s+name="app_name">.*?</string>', xml, re.S):
                  safe_name = (company_name.replace("&", "&amp;")
                                          .replace("<", "&lt;")
                                          .replace(">", "&gt;"))
                  xml = re.sub(
                      r'(<string\s+name="app_name">).*?(</string>)',
                      lambda m: m.group(1) + safe_name + m.group(2),
                      xml,
                      count=1,
                      flags=re.S
                  )
                  strings_file.write_text(xml, encoding="utf-8")
                  changed = True
          if not changed:
              print("WARNING: app_name string not found; APK will keep its existing launcher label.")

          # Save safe output metadata for the packaging step.
          safe_name = re.sub(r"[^A-Za-z0-9_-]+", "_", company_name).strip("_-") or "CompanyApp"
          safe_code = re.sub(r"[^A-Za-z0-9_-]+", "_", company_code).strip("_-") or "COMPANY"
          Path("company_apk_name.txt").write_text(f"{safe_name}-{safe_code}.apk", encoding="utf-8")
          PY

      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Prepare company APK
        run: |
          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_SOURCE"
          APK_NAME="$(cat company_apk_name.txt)"
          cp "$APK_SOURCE" "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload company APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.company_name }}-${{ inputs.company_code }}-APK
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30
